spring.application.name=citizen-registry-service
server.port=8080

# Σειριακοποίηση / αποσειριακοποίηση κατάστασης σε βάση δεδομένων (H2, αρχείο στο ./data)
spring.datasource.url=jdbc:h2:file:./data/citizen-registry;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Κονσόλα H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
